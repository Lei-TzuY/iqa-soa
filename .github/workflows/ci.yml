name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical integrity tests read frozen blobs/trees and construct
          # detached worktrees at recorded execution commits. A depth-1 clone
          # turns those checks into missing-object failures rather than testing
          # the artifact's actual chain of custody.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development environment
        run: python -m pip install -e '.[dev]'
      - name: Strict type check
        env:
          MYPYPATH: src
        run: python -m mypy src

  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development environment
        run: python -m pip install -e '.[dev]'
      - name: Run full deterministic test suite
        run: python -m pytest

  submission-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development environment
        run: python -m pip install -e '.[dev]'
      - name: Run reviewer verification path
        run: make verify-artifact
