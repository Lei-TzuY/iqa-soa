# Phase-P real-model QA-OFF benchmark-QUALIFICATION experiment configuration ONLY.
#
# THIS FILE AUTHORIZES NOTHING.  It is a prospectively frozen input to a future,
# separately human-gated Phase-P execution.  Loading it runs no model.
#
# Separate models path, separate output root.  It touches no frozen scientific
# artifact, reuses no Phase-F, Phase-I or Phase-L row, and must never be pooled
# with Stage-1, Stage-2, Phase-A, Phase-D, Phase-F, Phase-I, Phase-L or any
# future confirmatory measurement.  Phase-L-B rows in particular are the rc3
# requalification evidence that ended in HOLD; they are never qualification
# evidence for rc4 and are never compared against a Phase-P row.
#
# `treatments: ["off"]` is deliberate and is the whole point of Phase P: the
# question is whether pilot-v7-rc4's designed safe paths, challenge routes,
# multi-step causal prerequisites, resource modality, benign controls, deliberate
# negative control and fault opportunity are behaviourally REACHABLE under real
# models when no guard is running.  A FULL arm would answer a different
# (confirmatory) question and is out of scope: Phase P estimates no QA
# effectiveness, computes no treatment effect, reports no p-value, no odds ratio
# and no confidence interval, and ranks no model.
#
# This file is an ExperimentConfig, not a PilotConfig.  The generic PilotConfig
# path (iqa_soa.experiment.pilot.load_pilot_config) intentionally requires
# treatments == [off, full]; that safety requirement is NOT weakened, bypassed or
# modified by Phase P.  The Phase-P driver drives the already-validated
# ExperimentRunner directly, exactly as scripts/run_phaseD_qualification.py,
# scripts/run_phaseF_qualification.py, scripts/run_phaseI_requalification.py and
# scripts/run_phaseL_requalification.py already do.
#
# `seeds` carries the THREE seeds scripts/phaseP_derive_seeds.py derived
# deterministically from the canonical Phase-P base commit
# f65ee4980813b465431c5f7d75a0d00db87785b6 and the frozen domain separator,
# before any rc4 model result existed and without any model output as an input.
# The derivation and every rejected candidate are recorded in
# docs/phaseP_rc4_prospective_seed_derivation.json.
#
# The Phase-L triple (929260329, 1281385038, 978843421) was CONSUMED by the
# formal Phase-L-B execution and is permanently forbidden here, as are the
# Phase-F / Phase-I triple (1729, 2718, 3141) and the Phase-A extension seeds
# (5772, 8119).  scripts/phaseP_derive_seeds.py proves the forbidden set covers
# every seed the committed history records.
#
# `repetitions: 3` describes the seed count only.  The Phase-P driver does NOT
# use the runner's own case x repetition loop: it executes exactly one (task,
# seed) cell per runner invocation under the rc4 StopController, so that an
# immediate-stop condition can prevent the next cell and the next arm.
#
# max_agent_steps is 20, the value configs/experiment.yaml uses and therefore the
# value every frozen Stage-1/Stage-2/Phase-A/Phase-F/Phase-I/Phase-L real-model
# run used.  It is not tuned for Phase P.  It exceeds every rc4 task's
# max_tool_calls (max 5) so that a genuine over-budget proposal remains
# observable under QA OFF instead of being truncated by the harness -- which
# BUD-016, BUD-017 and BUD-018 require, since each retains a cap crossing as
# declared telemetry.
#
# benchmark_path is the benchmark root only so the runner can digest it; the
# executed case set comes from the frozen pilot-v7-rc4 manifest passed to the
# runner as frozen_benchmark, never from a directory scan.
schema_version: 1
benchmark_path: benchmark
policy_path: configs/policies/default.xml
models_path: configs/phaseP-models.yaml
ablations_path: configs/ablations.yaml
output_root: results/phaseP-rc4-qualification/raw
repetitions: 3
seeds: [1197050110, 1904689056, 1133353488]
max_agent_steps: 20
shuffle_treatments: false
treatments: ["off"]
smoke_case_ids: [BEN-002, BEN-003]
raw_jsonl: runs.jsonl
raw_csv: runs.csv
evidence_subdir: evidence
